name: Actions request bridge
run-name: "Actions bridge ${{ github.event.inputs.request_id || github.sha }}"
on:
  push:
    branches: [main]
    paths: ['.github/action-requests/*.json']
  workflow_dispatch:
    inputs:
      request_id:
        description: Bridge verification receipt
        required: true
        type: string
permissions:
  contents: read
  actions: write
jobs:
  douyin_transcript:
    if: github.event_name == 'workflow_dispatch' && (startsWith(inputs.request_id, 'https://') || inputs.request_id == 'douyin-local-test')
    uses: ./.github/workflows/douyin-transcript.yml
    with:
      mode: ${{ inputs.request_id == 'douyin-local-test' && 'local-test' || 'douyin' }}
      link: ${{ inputs.request_id == 'douyin-local-test' && '' || inputs.request_id }}
      model: medium
  request:
    if: github.event_name != 'workflow_dispatch' || (!startsWith(inputs.request_id, 'https://') && inputs.request_id != 'douyin-local-test')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Submit request or confirm dispatch receipt
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              receipt = {"status": "dispatch_verified", "request_id": os.environ["REQUEST_ID"], "run_id": os.environ["GITHUB_RUN_ID"]}
              summary.write_text("New workflow successfully started through request bridge.\n\n" + json.dumps(receipt, ensure_ascii=False), encoding="utf-8")
              print(json.dumps(receipt))
              raise SystemExit(0)
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          before, after = event["before"], event["after"]
          if before == "0" * 40:
              raise SystemExit("Request bridge requires an existing main branch")
          subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", before], check=True)
          changed = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=AM", before, after, "--", ".github/action-requests/"], text=True).splitlines()
          files = [p for p in changed if re.fullmatch(r"\.github/action-requests/[A-Za-z0-9_-]+\.json", p)]
          if len(files) != 1:
              raise SystemExit("Submit exactly one new or modified request JSON per commit")
          req = json.loads(pathlib.Path(files[0]).read_text())
          workflow, ref, inputs = req["workflow"], req["ref"], req.get("inputs", {})
          if not isinstance(workflow, str) or not re.fullmatch(r"[A-Za-z0-9_.-]+\.ya?ml", workflow):
              raise SystemExit("workflow must be a workflow filename")
          if not isinstance(ref, str) or not ref or not isinstance(inputs, dict) or not all(isinstance(k,str) and isinstance(v,(str,bool,int,float)) for k,v in inputs.items()):
              raise SystemExit("Invalid ref or inputs")
          url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches"
          body = json.dumps({"ref": ref, "inputs": inputs}).encode()
          request = urllib.request.Request(url, data=body, method="POST", headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              status = response.status
          receipt = {"status": "submitted", "http_status": status, "request_file": files[0], "workflow": workflow, "ref": ref}
          summary.write_text(json.dumps(receipt, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(receipt))
          PY
