name: Motion Hub integration verification
on:
  push:
    branches: [integration/motion-hub]
    paths: ['motion_hub/**', '.github/workflows/motion-hub.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python motion_hub/hub.py bootstrap
      - run: python motion_hub/hub.py validate
      - run: python motion_hub/tests/verify.py
