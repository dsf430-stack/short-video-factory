name: Douyin transcript isolated test
on:
  push:
    branches: [test/douyin-transcript-20261018]
    paths: ['.github/workflows/douyin-transcript-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Python and FFmpeg dependencies
        run: |
          mkdir -p verification/douyin
          python -m pip install requests ffmpeg-python
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake build-essential
          python -c "import requests, ffmpeg; print('Python dependencies OK')"
          ffmpeg -version > verification/douyin/ffmpeg-version.txt
      - name: Install pinned official douyin-transcript and whisper.cpp
        run: |
          git clone https://github.com/CherishLyf/douyin-transcript.git .douyin-tool
          git -C .douyin-tool checkout 421c11c6e167b5e38d9cd8fb4219ae926bd4643b
          git clone https://github.com/ggml-org/whisper.cpp.git .whisper
          git -C .whisper checkout 0c7be696371069e0baa2515ed7aa08d5a5473aa6
          cmake -S .whisper -B .whisper/build -DCMAKE_BUILD_TYPE=Release
          cmake --build .whisper/build -j 2 --config Release
          cd .whisper
          sh ./models/download-ggml-model.sh small
      - name: Configure official tool without API keys
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path.cwd()
          p = root / '.douyin-tool/configs/config-schema.json'
          config = json.loads(p.read_text())
          config['whisper'].update(bin=str(root/'.whisper/build/bin/whisper-cli'), model=str(root/'.whisper/models/ggml-small.bin'), language='zh')
          config['output'].update(default_dir=str(root/'verification/douyin/live'), format='srt', save_video=True)
          p.write_text(json.dumps(config, indent=2))
          PY
          python .douyin-tool/scripts/douyin_transcript.py --print-config
          sha256sum .whisper/models/ggml-small.bin > verification/douyin/model-sha256.txt
      - name: First test real Douyin link parsing
        id: link
        continue-on-error: true
        run: |
          set -o pipefail
          python -u - <<'PY' 2>&1 | tee verification/douyin/link-info.log
          import sys, pathlib, json, re, traceback
          sys.path.insert(0, str(pathlib.Path('.douyin-tool/scripts').resolve()))
          import douyin_transcript as dt
          dt.ensure_dependencies()
          original_get=dt.requests.get
          records=[]
          def diagnostic_get(*args, **kwargs):
              response=original_get(*args, **kwargs)
              record={'request_url':args[0],'resolved_url':response.url,'status':response.status_code,'bytes':len(response.content)}
              match=re.search(r"window\._ROUTER_DATA\s*=\s*(.*?)</script>",response.text,re.DOTALL)
              if match:
                  payload=json.loads(match.group(1).strip().rstrip(';'))
                  record['router_data']=payload
              records.append(record)
              pathlib.Path('verification/douyin/link-diagnostic.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
              return response
          dt.requests.get=diagnostic_get
          try:
              info=dt.get_video_info('https://v.douyin.com/lAfxhR2XUe8/')
              pathlib.Path('verification/douyin/info.json').write_text(json.dumps(info,ensure_ascii=False,indent=2))
              print(json.dumps(info,ensure_ascii=False,indent=2))
          except Exception:
              traceback.print_exc()
              print(json.dumps(records,ensure_ascii=False,indent=2))
              raise
          PY
      - name: Real Douyin video to SRT and transcript
        if: steps.link.outcome == 'success'
        run: |
          set -o pipefail
          python .douyin-tool/scripts/douyin_transcript.py --link 'https://v.douyin.com/lAfxhR2XUe8/' --action transcript --format srt --save-video --output verification/douyin/live 2>&1 | tee verification/douyin/live-srt.log
          python .douyin-tool/scripts/douyin_transcript.py --link 'https://v.douyin.com/lAfxhR2XUe8/' --action transcript --format text --output verification/douyin/live 2>&1 | tee verification/douyin/live-text.log
          python - <<'PY'
          import pathlib
          root=pathlib.Path('verification/douyin/live')
          for name in ('transcript.srt','transcript.md','meta.json','transcript-raw.json'):
              files=list(root.rglob(name))
              assert files and all(p.stat().st_size > 0 for p in files), name
          PY
      - name: Independent Chinese video transcription test using existing narration
        run: |
          set -o pipefail
          python -u - <<'PY' 2>&1 | tee verification/douyin/local-test.log
          import sys, pathlib, subprocess, json, re, hashlib
          sys.path.insert(0, str(pathlib.Path('.douyin-tool/scripts').resolve()))
          import douyin_transcript as dt
          dt.ensure_dependencies(require_ffmpeg=True)
          out=pathlib.Path('verification/douyin')
          source=pathlib.Path('handdraw/prepared/job-637378837c79e0ffd659/inputs/voice-2395983e1d4d5ff9.mp3')
          video=out/'chinese-test.mp4'
          subprocess.run(['ffmpeg','-y','-f','lavfi','-i','color=c=black:s=320x240:r=10','-i',str(source),'-shortest','-c:v','libx264','-c:a','aac',str(video)],check=True,capture_output=True)
          processor=dt.DouyinProcessor()
          audio=processor.extract_audio(video)
          srt=out/'transcript.srt'
          processor.transcribe_audio_to_srt(audio,srt,str(pathlib.Path('.whisper/build/bin/whisper-cli').resolve()),str(pathlib.Path('.whisper/models/ggml-small.bin').resolve()),'zh')
          segments=dt.parse_srt_segments(srt.read_text())
          assert segments, 'Empty subtitles'
          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(video)],text=True))
          assert all(0 <= s['start'] < s['end'] <= duration+0.5 for s in segments)
          text=''.join(s['text'] for s in segments)
          md=out/'transcript.md'
          md.write_text(dt.generate_markdown({'title':'Existing pencil narration local video test','duration_seconds':duration},segments))
          assert '鉛筆' in text or '铅笔' in text, text
          assert '石墨' in text, text
          assert md.stat().st_size and srt.stat().st_size
          report={'test':'independent existing Chinese narration, not a successful Douyin download','duration':duration,'segments':len(segments),'text':text,'files':{str(p):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in (video,srt,md)}}
          (out/'local-verification.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Upload actual outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-transcript-verification
          path: verification/douyin/
          if-no-files-found: error
          retention-days: 7
      - name: Require real link test success
        if: always()
        env:
          LINK_OUTCOME: ${{ steps.link.outcome }}
        run: |
          echo "Real Douyin link parsing: $LINK_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          test "$LINK_OUTCOME" = success
