name: R01 runner capability check
on:
  workflow_dispatch:
  push:
    branches: [feature/r01-official-voice]
    paths: [.github/workflows/r01-runner-check.yml]
permissions:
  contents: read
jobs:
  capability:
    runs-on: macos-14
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: arm64
      - name: Probe the MLX device without downloading a speech model
        run: |
          python -m pip install mlx
          python - <<'PY'
          import importlib.metadata, json, platform, subprocess
          import mlx.core as mx
          report={'architecture':platform.machine(),'mlx':importlib.metadata.version('mlx'),
                  'default_device':str(mx.default_device()),'metal_available':mx.metal.is_available(),
                  'memory_bytes':int(subprocess.check_output(['sysctl','-n','hw.memsize'],text=True))}
          print('R01_RUNNER_CAPABILITY='+json.dumps(report))
          PY
