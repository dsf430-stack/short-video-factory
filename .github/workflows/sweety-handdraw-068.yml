name: Sweety 手繪影片 · 068
run-name: "Sweety 068 · ${{ inputs.topic || '一滴水如何變成雨' }}"
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 影片主題（繁體中文）
        required: true
        default: 一滴水如何變成雨
        type: string
  push:
    branches: [integration/sweety-handdraw-068]
    paths: ['.github/workflows/sweety-handdraw-068.yml', 'handdraw/**']
permissions:
  contents: read
concurrency:
  group: sweety-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Fetch unchanged official engine and missing runtime dependencies
        run: |
          git clone https://github.com/threerocks/sweety-handdraw-video.git /tmp/sweety-official
          git -C /tmp/sweety-official checkout 5206ec0d17f9b353e400b64b9c51ad69e721e02a
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk libimage-exiftool-perl
          python -m pip install -r /tmp/sweety-official/skills/sweety-handdraw-video/scripts/requirements.txt -r smart_voice/requirements.txt
      - name: Identify resumable topic job
        id: topic
        env:
          TOPIC: ${{ inputs.topic || '一滴水如何變成雨' }}
        run: |
          python - <<'PY'
          import os, hashlib
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('key=' + hashlib.sha256(os.environ['TOPIC'].encode()).hexdigest()[:24] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            handdraw/output
            smart_voice/output/.068-cache
          key: sweety-068-v1-${{ steps.topic.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sweety-068-v1-${{ steps.topic.outputs.key }}-
      - name: Generate script, official handdraw animation, existing 068 and verify full MP4
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          TEXT_MODEL: ${{ vars.HANDDRAW_TEXT_MODEL }}
          IMAGE_MODEL: ${{ vars.HANDDRAW_IMAGE_MODEL }}
          TOPIC: ${{ inputs.topic || '一滴水如何變成雨' }}
        run: |
          set -o pipefail
          mkdir -p handdraw/output
          python -u handdraw/produce.py --topic "$TOPIC" --seconds 30 --official /tmp/sweety-official --output handdraw/output 2>&1 | tee handdraw/output/run.log
      - name: Save completed model calls and verified voice work
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            handdraw/output
            smart_voice/output/.068-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload verified final film
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sweety-068-rain-1080x1920-${{ github.run_id }}
          path: |
            handdraw/output/outputs/film.mp4
            handdraw/output/outputs/cover.png
            handdraw/output/outputs/editing/transcript.srt
            handdraw/output/script.txt
            handdraw/output/acceptance.json
            handdraw/output/outputs/verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweety-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            handdraw/output/run.log
            handdraw/output/story.json
            handdraw/output/design.json
            handdraw/output/design
            handdraw/output/privacy
            handdraw/output/*review.json
            handdraw/output/job.json
            handdraw/output/work/review
            handdraw/output/work/verification.json
            handdraw/output/inputs/*.json
            handdraw/output/inputs/*.error.log
          if-no-files-found: ignore
          retention-days: 14
