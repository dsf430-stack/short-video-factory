name: Sweety 手繪影片 · 068
run-name: "Sweety 068 · ${{ inputs.topic || inputs.job_id || '已啟用製作任務' }}"
on:
  workflow_dispatch:
    inputs:
      operation:
        description: render 製片 / validate 檢查分流 / archive 只保存既有成片
        required: true
        default: render
        type: choice
        options: [render, validate, archive]
      save_to_drive:
        description: 成功成片保存到指定 Drive 資料夾（須先完成 OAuth）
        required: true
        default: true
        type: boolean
      archive_run_id:
        description: archive 專用：來源 Actions Run ID（不重新渲染）
        required: false
        type: string
      job_id:
        description: 已準備任務 ID（優先使用；免題材索引）
        required: false
        type: string
      topic:
        description: 主題（未填則使用 active-job.json）
        required: false
        type: string
      seconds:
        description: 影片秒數（未填沿用任務設定）
        required: false
        type: number
      style:
        description: 官方畫風編號（未填沿用已審查設定）
        required: false
        type: string
  pull_request:
    paths: ['handdraw/**', '.github/workflows/sweety-handdraw-068.yml']
  push:
    branches: [main, integration/sweety-handdraw-068, fix/handdraw-no-api-ready]
    paths: ['handdraw/active-job.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: sweety-${{ github.ref }}-${{ inputs.job_id || inputs.topic || 'active' }}
  cancel-in-progress: false
jobs:
  routing-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test existing rendering contracts and archive safety
        run: python -m unittest discover -s handdraw -p 'test_*.py'
      - name: Check Drive authorization before spending render time
        if: github.event_name != 'pull_request' && inputs.operation != 'validate' && (github.event_name == 'push' || inputs.save_to_drive || inputs.operation == 'archive')
        env:
          GDRIVE_AUTHORIZED_USER_JSON: ${{ secrets.GDRIVE_AUTHORIZED_USER_JSON }}
        run: |
          if [ -z "$GDRIVE_AUTHORIZED_USER_JSON" ]; then
            echo "::error::DRIVE_AUTH_REQUIRED: configure GDRIVE_AUTHORIZED_USER_JSON; no render started."
            exit 1
          fi
          python -m pip install -r handdraw/drive-requirements.txt
          python handdraw/archive_drive.py --preflight
  render:
    needs: routing-checks
    if: github.event_name != 'pull_request' && inputs.operation != 'validate' && inputs.operation != 'archive'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve exact prepared job and isolated output path
        id: job
        env:
          HANDDRAW_INPUTS: ${{ toJSON(inputs) }}
        run: python handdraw/resolve_job.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Fetch unchanged official engine and runtime dependencies
        run: |
          git clone https://github.com/threerocks/sweety-handdraw-video.git /tmp/sweety-official
          git -C /tmp/sweety-official checkout 5206ec0d17f9b353e400b64b9c51ad69e721e02a
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk libimage-exiftool-perl
          python -m pip install -r /tmp/sweety-official/skills/sweety-handdraw-video/scripts/requirements.txt -r smart_voice/requirements.txt
      - name: Resolve checksum-verified official pen
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          skill = Path('/tmp/sweety-official/skills/sweety-handdraw-video')
          sys.path.insert(0, str(skill / 'scripts'))
          from hosted_assets import resolve_asset
          print(resolve_asset(skill / 'assets/hands/pen-only.png'))
          PY
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ${{ steps.job.outputs.root }}
            smart_voice/output/.068-cache
          key: sweety-jobs-v2-${{ steps.job.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sweety-jobs-v2-${{ steps.job.outputs.key }}-
      - name: Render assistant-prepared job without extra model API
        env:
          HANDDRAW_TOPIC: ${{ steps.job.outputs.topic }}
          HANDDRAW_SECONDS: ${{ steps.job.outputs.seconds }}
          HANDDRAW_STYLE: ${{ steps.job.outputs.style }}
          HANDDRAW_JOB_ID: ${{ steps.job.outputs.job_id }}
          HANDDRAW_JOB_ROOT: ${{ steps.job.outputs.root }}
        run: |
          set -o pipefail
          mkdir -p "$HANDDRAW_JOB_ROOT"
          args=(--topic "$HANDDRAW_TOPIC" --job-id "$HANDDRAW_JOB_ID" --seconds "$HANDDRAW_SECONDS" --official /tmp/sweety-official --output "$HANDDRAW_JOB_ROOT")
          if [ -n "$HANDDRAW_STYLE" ]; then args+=(--style "$HANDDRAW_STYLE"); fi
          python -u handdraw/produce.py "${args[@]}" 2>&1 | tee "$HANDDRAW_JOB_ROOT/run.log"
      - name: Save resumable job and verified voice work
        if: always() && steps.cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.job.outputs.root }}
            smart_voice/output/.068-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload verified MP4 and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sweety-068-${{ steps.job.outputs.job_id }}-${{ github.run_id }}
          path: |
            ${{ steps.job.outputs.root }}/outputs/film.mp4
            ${{ steps.job.outputs.root }}/outputs/cover.png
            ${{ steps.job.outputs.root }}/outputs/editing/transcript.srt
            ${{ steps.job.outputs.root }}/script.txt
            ${{ steps.job.outputs.root }}/acceptance.json
            ${{ steps.job.outputs.root }}/work/verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic and continuation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweety-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            handdraw/prepared/**/request.json
            handdraw/prepared/**/preparation-status.json
            ${{ steps.job.outputs.root }}/run.log
            ${{ steps.job.outputs.root }}/voice-measurement.json
            ${{ steps.job.outputs.root }}/acceptance.json
            ${{ steps.job.outputs.root }}/design.json
            ${{ steps.job.outputs.root }}/design
            ${{ steps.job.outputs.root }}/privacy
            ${{ steps.job.outputs.root }}/*review.json
            ${{ steps.job.outputs.root }}/job.json
            ${{ steps.job.outputs.root }}/work/review
            ${{ steps.job.outputs.root }}/work/verification.json
            ${{ steps.job.outputs.root }}/work/timeline.json
            ${{ steps.job.outputs.root }}/inputs/*.json
            ${{ steps.job.outputs.root }}/inputs/*.error.log
          if-no-files-found: ignore
          retention-days: 14
  archive:
    needs: [routing-checks, render]
    if: >-
      ${{ always() && needs.routing-checks.result == 'success' &&
      ((inputs.operation == 'archive') || (needs.render.result == 'success' && (github.event_name == 'push' || inputs.save_to_drive))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sweety-drive-archive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve source run without rerendering
        id: source
        env:
          REQUESTED_RUN_ID: ${{ inputs.archive_run_id }}
          OPERATION: ${{ inputs.operation }}
        run: |
          python - <<'PY'
          import os, re
          source = os.environ['REQUESTED_RUN_ID'] if os.environ['OPERATION'] == 'archive' else os.environ['GITHUB_RUN_ID']
          if not re.fullmatch(r'[1-9][0-9]*', source):
              raise SystemExit('archive requires a numeric source Run ID')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run_id=' + source + '\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: sweety-068-*
          path: archive-input
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Verify artifact and save to Drive
        env:
          GDRIVE_AUTHORIZED_USER_JSON: ${{ secrets.GDRIVE_AUTHORIZED_USER_JSON }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r handdraw/drive-requirements.txt
          python handdraw/archive_drive.py --artifact archive-input --receipt archive-evidence/drive-receipt.json
      - name: Preserve Drive receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-receipt-${{ github.run_id }}
          path: archive-evidence/drive-receipt.json
          if-no-files-found: warn
          retention-days: 90

