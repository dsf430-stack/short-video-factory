name: Sweety 手繪影片 · 068
run-name: "Sweety 068 · ${{ inputs.topic || (github.ref_name == 'render/gum-style4-80s' && '口香糖包裝的鋸齒邊' || '一滴水如何變成雨') }}"
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 影片主題（繁體中文）
        required: true
        default: 一滴水如何變成雨
        type: string
      seconds:
        description: 目標成片秒數（旁白必須自然符合，不能截斷或變速）
        required: true
        default: 30
        type: number
  push:
    branches: [integration/sweety-handdraw-068, render/gum-style4-80s]
    paths: ['.github/workflows/sweety-handdraw-068.yml', 'handdraw/**']
permissions:
  contents: read
concurrency:
  group: sweety-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Fetch unchanged official engine and missing runtime dependencies
        run: |
          git clone https://github.com/threerocks/sweety-handdraw-video.git /tmp/sweety-official
          git -C /tmp/sweety-official checkout 5206ec0d17f9b353e400b64b9c51ad69e721e02a
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk libimage-exiftool-perl
          python -m pip install -r /tmp/sweety-official/skills/sweety-handdraw-video/scripts/requirements.txt -r smart_voice/requirements.txt
      - name: Resolve checksum-verified official pen before cached-film verification
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          skill = Path('/tmp/sweety-official/skills/sweety-handdraw-video')
          sys.path.insert(0, str(skill / 'scripts'))
          from hosted_assets import resolve_asset
          print(resolve_asset(skill / 'assets/hands/pen-only.png'))
          PY
      - name: Identify resumable topic job
        id: topic
        env:
          TOPIC: ${{ inputs.topic || (github.ref_name == 'render/gum-style4-80s' && '口香糖包裝的鋸齒邊' || '一滴水如何變成雨') }}
        run: |
          python - <<'PY'
          import os, hashlib
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('key=' + hashlib.sha256(os.environ['TOPIC'].encode()).hexdigest()[:24] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            handdraw/output
            smart_voice/output/.068-cache
          key: sweety-prepared-v1-${{ steps.topic.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sweety-prepared-v1-${{ steps.topic.outputs.key }}-
            sweety-prepared-v1-cd2977c7746f3e88c302ae98-
      - name: Reuse matching measured complete narration without regenerating it
        run: |
          python - <<'PYVOICE'
          import json,hashlib,shutil
          from pathlib import Path
          bundle=Path('handdraw/prepared/gum-style4')
          if bundle.exists():
              story=json.loads((bundle/'story.json').read_text())
              text=''.join(s['text'] for s in story['scenes'])
              h=hashlib.sha256(text.encode()).hexdigest()
              source=Path('handdraw/output/gum-style4/narration-v2.mp3')
              if source.exists():
                  meta=json.loads(source.with_suffix('.json').read_text())
                  if meta['text_sha256']==h and meta['sha256']==hashlib.sha256(source.read_bytes()).hexdigest():
                      target=Path('handdraw/output/prepared/inputs')/('voice-'+h[:16]+'.mp3')
                      target.parent.mkdir(parents=True,exist_ok=True)
                      for ext in ['.mp3','.json','.srt']:
                          shutil.copyfile(source.with_suffix(ext),target.with_suffix(ext))
                      print('REUSED_MEASURED_COMPLETE_NARRATION',meta['duration'])
          PYVOICE
      - name: Render prepared official handdraw job using existing 068
        env:
          TOPIC: ${{ inputs.topic || (github.ref_name == 'render/gum-style4-80s' && '口香糖包裝的鋸齒邊' || '一滴水如何變成雨') }}
        run: |
          set -o pipefail
          mkdir -p handdraw/output
          python -u handdraw/produce.py --topic "$TOPIC" --seconds ${{ inputs.seconds || (github.ref_name == 'render/gum-style4-80s' && 80 || 30) }} --official /tmp/sweety-official --output handdraw/output/prepared 2>&1 | tee handdraw/output/run.log
      - name: Save prepared job and verified voice work
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            handdraw/output
            smart_voice/output/.068-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload verified final film
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sweety-068-1080x1920-${{ github.run_id }}
          path: |
            handdraw/output/prepared/outputs/film.mp4
            handdraw/output/prepared/outputs/cover.png
            handdraw/output/prepared/outputs/editing/transcript.srt
            handdraw/output/prepared/script.txt
            handdraw/output/prepared/acceptance.json
            handdraw/output/prepared/outputs/verification.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweety-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            handdraw/output/run.log
            handdraw/output/prepared/voice-measurement.json
            handdraw/output/prepared/acceptance.json
            handdraw/prepared/gum-style4/story.json
            handdraw/output/prepared/design.json
            handdraw/output/prepared/design
            handdraw/output/prepared/privacy
            handdraw/output/prepared/*review.json
            handdraw/output/prepared/job.json
            handdraw/output/prepared/work/review
            handdraw/output/prepared/work/timeline.json
            handdraw/output/prepared/privacy
            handdraw/output/prepared/work/verification.json
            handdraw/output/prepared/inputs/*.json
            handdraw/output/prepared/inputs/*.error.log
          if-no-files-found: ignore
          retention-days: 14
