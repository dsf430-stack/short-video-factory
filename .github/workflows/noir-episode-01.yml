name: Noir episode 01 render
on:
  workflow_dispatch:
  push:
    branches: [feature/noir-episode-01]
    paths:
      - handdraw/episodes/**
      - .github/workflows/noir-episode-01.yml
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install Pillow edge-tts
      - name: Render 60s pilot
        run: python handdraw/episodes/render_noir_ep01.py --output noir-ep01.mp4
      - name: Verify video and audio
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 noir-ep01.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 noir-ep01.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noir-episode-01
          path: |
            noir-ep01.mp4
            noir-work/narration.txt
