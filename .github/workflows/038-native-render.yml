name: 038 native Lemo building film
on:
  push:
    branches: [test/style-038-building-40s]
    paths:
      - '.github/workflows/038-native-render.yml'
      - 'motion_hub/jobs/038-building-40s/native/**'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r smart_voice/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Obtain original Lemo pinned version
        run: |
          git clone https://github.com/lemomo-ai/lemo-opuscar.git /tmp/lemo-opuscar
          git -C /tmp/lemo-opuscar checkout fdc46d7f0e20cc953a71d56241a92d1b4cb7298e
          cd /tmp/lemo-opuscar
          npm ci
          mkdir -p styles/tilt-shift/demo/038-building
          cp "$GITHUB_WORKSPACE"/motion_hub/jobs/038-building-40s/native/{index.html,main.js} styles/tilt-shift/demo/038-building/
      - name: Generate official 068 narration
        run: |
          mkdir -p "$RUNNER_TEMP/038"
          python smart_voice/generate_voice.py --voice-id 068 --text-file motion_hub/jobs/038-building-40s/native/narration.txt --output "$RUNNER_TEMP/038/voice.mp3"
      - name: Extend narration track to exactly forty seconds without altering 068 voice\n        run: |\n          ffmpeg -v error -y -i "$RUNNER_TEMP/038/voice.mp3" -af apad -t 40 "$RUNNER_TEMP/038/voice40.wav"\n      - name: Render native Lemo 038 scene
        run: |
          python motion_hub/render.py /tmp/lemo-opuscar/styles/tilt-shift/demo/038-building/index.html "$RUNNER_TEMP/038/film.mp4" --root /tmp/lemo-opuscar --duration 40 --fps 30 --size 1080x1920 --audio "$RUNNER_TEMP/038/voice40.wav"
      - name: Verify 068 and output streams
        run: |
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate -show_entries format=duration -of json "$RUNNER_TEMP/038/film.mp4"
          ffmpeg -v error -i "$RUNNER_TEMP/038/film.mp4" -f null -
      - name: Save film and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 038-native-building-results
          path: |
            ${{ runner.temp }}/038/
          if-no-files-found: warn
          retention-days: 30
