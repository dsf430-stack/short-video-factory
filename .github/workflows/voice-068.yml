name: 068 曉臻配音
on:
  workflow_dispatch:
    inputs:
      narration:
        description: '貼上繁體中文旁白（最多 10000 字）'
        required: true
        type: string
      filename:
        description: '輸出檔名（不含副檔名）'
        required: false
        default: 'voice-068'
        type: string
      rate:
        description: '僅本次已授權語速；留空保留068預設'
        required: false
        default: ''
        type: string
      boundary:
        description: '字幕時間戳粒度'
        required: false
        default: SentenceBoundary
        type: choice
        options: [SentenceBoundary, WordBoundary]
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing voice dependencies
        run: |
          set -euxo pipefail
          command -v python
          python --version
          command -v ffmpeg || true
          command -v ffprobe || true
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install -r smart_voice/requirements.txt
          python -c "import edge_tts, certifi; print('Edge TTS and CA bundle available')"
          ffmpeg -version
          ffprobe -version
      - name: Restore verified voice chunks
        id: chunks-cache
        uses: actions/cache/restore@v4
        with:
          path: smart_voice/output/.068-cache
          key: voice-068-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: voice-068-v1-${{ runner.os }}-
      - name: Generate and verify 068 MP3/SRT
        env:
          NARRATION: ${{ inputs.narration }}
          OUTPUT_NAME: ${{ inputs.filename }}
          VOICE_RATE: ${{ inputs.rate }}
          VOICE_BOUNDARY: ${{ inputs.boundary || 'SentenceBoundary' }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          name=os.environ['OUTPUT_NAME'].strip()
          if not re.fullmatch(r'[a-zA-Z0-9_-]{1,64}', name):
              raise SystemExit('Filename must be 1-64 ASCII letters, digits, _ or -')
          text=os.environ['NARRATION'].strip()
          if not text or len(text)>10000:
              raise SystemExit('Narration must contain 1-10000 characters')
          pathlib.Path('smart_voice/output').mkdir(parents=True, exist_ok=True)
          pathlib.Path('smart_voice/output/narration.txt').write_text(text,encoding='utf-8')
          PY
          set -euxo pipefail
          rate_args=()
          if [ -n "$VOICE_RATE" ]; then rate_args+=("--rate=$VOICE_RATE"); fi
          python smart_voice/generate_voice.py --voice-id 068 --text-file smart_voice/output/narration.txt --output "smart_voice/output/${OUTPUT_NAME}.mp3" --boundary "$VOICE_BOUNDARY" "${rate_args[@]}"
      - name: Save completed chunks even after a later failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: smart_voice/output/.068-cache
          key: ${{ steps.chunks-cache.outputs.cache-primary-key }}
      - name: Upload verified audio and subtitles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 068-voice-output
          path: |
            smart_voice/output/*.mp3
            smart_voice/output/*.srt
            smart_voice/output/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Report failure context
        if: failure()
        shell: bash
        run: |
          echo "PATH=$PATH"
          command -v python || true
          command -v ffmpeg || true
          command -v ffprobe || true
          ls -la smart_voice/output/ || true
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 068-error-log
          path: |
            smart_voice/output/*.error.log
            smart_voice/output/*.progress.json
          if-no-files-found: ignore

